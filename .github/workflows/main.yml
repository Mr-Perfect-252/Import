name: Download PDFs
on: workflow_dispatch
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Download PDFs
        run: |
          mkdir -p TS_Class10_Complete
          cd TS_Class10_Complete
          : > ../failed.txt
          while read -r name url; do
            [ -z "$name" ] && continue
            if curl -fL -sS --retry 2 -m 180 -A "Mozilla/5.0" -o "$name" "$url" && head -c 4 "$name" | grep -q '%PDF'; then
              echo "OK   $name"
            else
              echo "FAIL $name $url" | tee -a ../failed.txt
              rm -f "$name"
            fi
          done <<'LIST'
          Textbook_Maths_EM.pdf https://cdn1.byjus.com/wp-content/uploads/2021/09/TS-SCERT-Class-10-Maths-Textbook-in-English-Medium.pdf
